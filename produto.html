<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peça — MundoMoedas</title>
<meta name="description" content="Detalhes da peça: estado de conservação, variações disponíveis e formas de pagamento.">
<meta name="robots" content="index, follow">
<link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Layout da página da peça */
  .prod { display:grid; grid-template-columns: 1fr 1fr; gap:3rem; align-items:start; }
  @media (max-width:900px){ .prod { grid-template-columns:1fr; gap:2rem; } }

  .prod__img { aspect-ratio:1; background:var(--folha); border:2px solid var(--veludo); overflow:hidden; position:sticky; top:84px; }
  .prod__img img { width:100%; height:100%; object-fit:contain; }
  @media (max-width:900px){ .prod__img { position:static; } }

  .prod__ano { font-family:var(--font-display); font-size:clamp(2.6rem,6vw,4rem); font-weight:600; line-height:1; letter-spacing:-.02em; margin-bottom:.6rem; }
  .prod__title { font-size:clamp(1.4rem,3vw,2rem); margin-bottom:.75rem; }
  .prod__price { font-family:var(--font-display); font-size:2.2rem; font-weight:600; margin:1.25rem 0 .4rem; }
  .prod__from { font-size:.9rem; color:var(--cinza); margin-bottom:1.2rem; }

  .prod__meta { display:flex; gap:1.75rem; flex-wrap:wrap; padding:1rem 0; border-top:1px solid var(--linha); border-bottom:1px solid var(--linha); margin-bottom:1.75rem; }
  .prod__meta div span { display:block; font-size:.85rem; color:var(--cinza); margin-bottom:.1rem; }
  .prod__meta div strong { font-size:1rem; }

  .bloco { margin-bottom:1.75rem; }
  .bloco h3 { font-family:var(--font-body); font-size:1rem; font-weight:700; margin-bottom:.7rem; }

  .var-opts { display:flex; flex-direction:column; gap:.5rem; max-height:340px; overflow-y:auto; padding-right:.4rem; }
  .var-opt { display:flex; align-items:center; gap:.9rem; padding:.8rem 1rem; background:var(--marfim); border:1.5px solid var(--linha); border-radius:var(--radius); cursor:pointer; }
  .var-opt:hover { border-color:var(--veludo); }
  .var-opt.is-on { border-color:var(--veludo); box-shadow:inset 0 0 0 1px var(--veludo); }
  .var-opt.is-off { opacity:.5; cursor:not-allowed; }
  .var-opt input { accent-color:var(--veludo); width:17px; height:17px; flex-shrink:0; }
  .var-opt__name { flex:1; font-size:.95rem; font-weight:500; }
  .var-opt__price { font-family:var(--font-display); font-weight:600; font-size:1.05rem; }
  .var-opt__stk { font-size:.8rem; }

  .qtd { display:flex; align-items:center; gap:.8rem; }
  .qtd__ctrl { display:flex; background:var(--marfim); border:1.5px solid var(--linha); border-radius:var(--radius); overflow:hidden; }
  .qtd__ctrl button { width:44px; height:46px; display:grid; place-items:center; font-size:1.3rem; }
  .qtd__ctrl button:hover:not(:disabled) { background:var(--folha); }
  .qtd__ctrl button:disabled { opacity:.35; cursor:not-allowed; }
  .qtd__ctrl input { width:60px; text-align:center; background:transparent; border:none; border-left:1.5px solid var(--linha); border-right:1.5px solid var(--linha); font-weight:700; height:46px; }
  .qtd__ctrl input::-webkit-outer-spin-button,.qtd__ctrl input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .qtd__ctrl input[type=number] { -moz-appearance:textfield; }

  .desc { white-space:pre-line; color:var(--cinza); line-height:1.75; max-height:340px; overflow-y:auto; padding-right:.6rem; }

  .aviso { display:flex; gap:.85rem; padding:1rem 1.25rem; background:var(--marfim); border-left:3px solid var(--veludo); font-size:.92rem; color:var(--cinza); line-height:1.65; }
  .aviso svg { width:20px; height:20px; color:var(--veludo); flex-shrink:0; margin-top:2px; }

  .sechead { margin-bottom:1.25rem; }
  .rel { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:2px; background:var(--veludo); border-block:2px solid var(--veludo); }
  @media (min-width:900px) { .rel { grid-template-columns:repeat(4,minmax(0,1fr)); } }
</style>
</head>
<body>

<header id="topo" class="header"></header>

<main class="section section--tight">
  <div class="wrap">
    <nav class="crumb" aria-label="Você está aqui">
      <a href="index.html">Todas as peças</a><span>/</span>
      <span id="crumbAtual">Peça</span>
    </nav>

    <div id="conteudo" aria-busy="true">
      <div class="prod">
        <div class="skeleton" style="aspect-ratio:1"></div>
        <div>
          <div class="skeleton" style="height:56px;width:45%;margin-bottom:1rem"></div>
          <div class="skeleton" style="height:88px;margin-bottom:1rem"></div>
          <div class="skeleton" style="height:44px;width:35%;margin-bottom:1.5rem"></div>
          <div class="skeleton" style="height:180px"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<section class="section section--cream" id="secaoRelacionados" hidden>
  <div class="wrap">
    <div class="sechead">
      <span class="eyebrow">Você também pode gostar</span>
      <h2>Peças relacionadas</h2>
    </div>
  </div>
  <div class="wrap">
    <div class="rel" id="relacionados"></div>
  </div>
</section>

<section class="brinde">
  <div class="wrap">
    <h2>Brinde exclusivo para você!</h2>
    <p>Compre qualquer produto na nossa <strong>loja da Shopee</strong>, abra o chat e envie a mensagem:</p>
    <div class="brinde__code">"Vim pelo site MundoMoedas"</div>
    <p>Você ganha um <strong>brinde surpresa</strong> na sua próxima compra!</p>
    <a href="https://shopee.com.br/shop/486896133" class="btn btn--marfim" target="_blank" rel="noopener">Ir para a Shopee</a>
  </div>
</section>

<footer id="rodape" class="footer"></footer>

<script src="js/logica.js"></script>
<script src="js/app.js"></script>
<script>
let PROD = null;
let QTD  = 1;

(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const todos = await carregarCatalogo();
  const box = document.getElementById('conteudo');

  if (!id) {
    box.innerHTML = '<div class="empty"><h3>Peça não informada</h3><p>Escolha uma peça no catálogo.</p><a href="index.html" class="btn btn--contorno">Ver catálogo</a></div>';
    box.removeAttribute('aria-busy');
    return;
  }

  PROD = todos.find(p => String(p.id) === String(id));
  if (!PROD) {
    box.innerHTML = '<div class="empty"><h3>Peça não encontrada</h3><p>Ela pode ter sido removida do catálogo.</p><a href="index.html" class="btn btn--contorno">Ver catálogo</a></div>';
    box.removeAttribute('aria-busy');
    return;
  }

  document.title = `${PROD.nome} — MundoMoedas`;
  document.getElementById('crumbAtual').textContent = PROD.nome.slice(0, 42);
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', PROD.nome.slice(0, 155));

  render();
  box.removeAttribute('aria-busy');
  relacionados(todos);
})();

function rotuloDoGrupo(p) {
  const g = GRUPOS.find(x => x.id === gruposDe(p)[0]);
  return g ? g.rotulo : 'Moedas';
}

function render() {
  const p = PROD;
  const vs = p.variacoes || [];
  const temVar = vs.length > 0;
  const { min, max } = precos(p);
  const estTotal = estoqueInfo(estoqueTotal(p));
  const ano = extrairAno(p.nome);
  const grupo = rotuloDoGrupo(p);

  const varHTML = temVar
    ? `<div class="var-opts" role="radiogroup" aria-label="Escolha a variação">
        ${vs.map((v, i) => {
          const est = Number(v.estoque) || 0;
          const cls = est <= 0 ? 'out' : (est <= 5 ? 'low' : 'ok');
          const stk = est <= 0 ? 'Indisponível' : (est === 1 ? 'Última' : est <= 5 ? `Últimas ${est}` : `${est} un.`);
          return `<label class="var-opt${i === 0 && est > 0 ? ' is-on' : ''}${est <= 0 ? ' is-off' : ''}">
            <input type="radio" name="variacao" value="${i}" ${i === 0 && est > 0 ? 'checked' : ''} ${est <= 0 ? 'disabled' : ''}>
            <span class="var-opt__name">${escapeHTML(v.nome || 'Padrão')}</span>
            <span class="stk-${cls} var-opt__stk">${stk}</span>
            <span class="var-opt__price">${brl(v.preco)}</span>
          </label>`;
        }).join('')}
       </div>`
    : `<p class="lead">Peça única, sem variações.</p>`;

  document.getElementById('conteudo').innerHTML = `
  <div class="prod">
    <div>
      <div class="prod__img">
        <img src="${escapeHTML(p.imagem)}" alt="${escapeHTML(p.nome)}" onerror="this.onerror=null;this.src='assets/images/placeholder.svg'">
      </div>
    </div>

    <div>
      ${ano ? `<div class="prod__ano">${ano}</div>` : ''}
      <h1 class="prod__title">${escapeHTML(p.nome)}</h1>
      <p class="lead card__stock card__stock--${estTotal.cls}">${estTotal.txt}</p>

      <div class="prod__price">${brl(min)}</div>
      ${max > min ? `<p class="prod__from">Preços variam de ${brl(min)} a ${brl(max)} conforme a variação</p>` : ''}

      <div class="prod__meta">
        <div><span>Tipo</span><strong>${grupo}</strong></div>
        <div><span>Itens</span><strong>${temVar ? vs.length + (vs.length > 1 ? ' variações' : ' variação') : 'Peça única'}</strong></div>
        <div><span>Disponibilidade</span><strong>${estoqueTotal(p)} un.</strong></div>
      </div>

      <div class="bloco">
        <h3>${temVar ? 'Escolha a variação' : 'Quantidade'}</h3>
        ${varHTML}
      </div>

      <div class="bloco">
        <div class="qtd">
          <div class="qtd__ctrl">
            <button type="button" id="menos" aria-label="Diminuir quantidade">−</button>
            <input type="number" id="qtd" value="1" min="1" max="1" aria-label="Quantidade">
            <button type="button" id="mais" aria-label="Aumentar quantidade">+</button>
          </div>
          <span id="qtdEstoque" class="card__stock"></span>
        </div>
      </div>

      <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:2rem">
        <button class="btn btn--primario" id="add" ${estTotal.cls === 'out' ? 'disabled' : ''} style="flex:1;min-width:200px">
          ${estTotal.cls === 'out' ? 'Indisponível' : 'Adicionar ao carrinho'}
        </button>
        <a class="btn btn--contorno" href="${escapeHTML(p.shopee_url || LOJA.shopee)}" target="_blank" rel="noopener">Comprar na Shopee</a>
      </div>

      ${p.descricao ? `
      <div class="bloco">
        <h3>Descrição</h3>
        <div class="desc">${escapeHTML(p.descricao)}</div>
      </div>` : ''}

      <div class="aviso">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
        <div>
          <strong style="color:var(--tinta)">Peças autênticas, selecionadas com rigor.</strong><br>
          Todos os itens passam por inspeção visual antes do envio. O estado de conservação
          aparece na descrição. Em caso de dúvida, fale com a gente pelo WhatsApp —
          mandamos fotos detalhadas da peça.
        </div>
      </div>
    </div>
  </div>`;

  // ---- Interações ----
  const qtd = document.getElementById('qtd');
  const menos = document.getElementById('menos');
  const mais = document.getElementById('mais');
  const lblEstoque = document.getElementById('qtdEstoque');

  function varSel() {
    const r = document.querySelector('input[name="variacao"]:checked');
    return r ? (PROD.variacoes || [])[Number(r.value)] : null;
  }

  function syncQtd() {
    const v = varSel();
    const disp = v ? (Number(v.estoque) || 0) : (Number(PROD.estoque) || estoqueTotal(PROD));
    const max = Math.max(1, disp);
    qtd.max = max;
    if (QTD > max) QTD = max;
    if (QTD < 1) QTD = 1;
    qtd.value = QTD;
    menos.disabled = QTD <= 1;
    mais.disabled = QTD >= max;
    const e = estoqueInfo(disp);
    lblEstoque.textContent = e.txt;
    lblEstoque.className = 'card__stock card__stock--' + e.cls;
  }

  /** O preço principal acompanha a variação marcada */
  function syncPreco() {
    const v = varSel();
    if (!v) return;
    document.querySelector('.prod__price').textContent = brl(v.preco);
    const from = document.querySelector('.prod__from');
    if (from) from.style.display = 'none';
  }

  document.querySelectorAll('input[name="variacao"]').forEach(r => {
    r.addEventListener('change', () => {
      document.querySelectorAll('.var-opt').forEach(o => o.classList.remove('is-on'));
      r.closest('.var-opt').classList.add('is-on');
      QTD = 1;
      syncQtd();
      syncPreco();
    });
  });

  menos.addEventListener('click', () => { QTD = Math.max(1, QTD - 1); qtd.value = QTD; syncQtd(); });
  mais .addEventListener('click', () => { QTD = Math.min(Number(qtd.max), QTD + 1); qtd.value = QTD; syncQtd(); });
  qtd.addEventListener('change', () => {
    let v = parseInt(qtd.value, 10);
    if (isNaN(v) || v < 1) v = 1;
    if (v > Number(qtd.max)) v = Number(qtd.max);
    QTD = v; qtd.value = v; syncQtd();
  });

  document.getElementById('add').addEventListener('click', () => {
    const v = varSel();
    Cart.add(PROD, v, QTD);
  });

  syncQtd();
  syncPreco();
}

/** Até 4 peças em estoque do mesmo tipo; se faltar, completa com as de maior valor */
function relacionados(todos) {
  const p = PROD;
  if (!p) return;

  const disp = todos.filter(o => o.id !== p.id && estoqueTotal(o) > 0)
    .sort((a, b) => precos(b).max - precos(a).max);
  const meu = gruposDe(p)[0];
  const mesmos = meu ? disp.filter(o => gruposDe(o).includes(meu)) : [];
  const lista = [...mesmos, ...disp.filter(o => !mesmos.includes(o))].slice(0, 4);

  if (!lista.length) return;

  document.getElementById('relacionados').innerHTML = lista.map(pecaHTML).join('');
  document.getElementById('secaoRelacionados').hidden = false;
}
</script>
</body>
</html>
